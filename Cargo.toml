[package]
name = "mrtechtrivia-bot"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
description = "Community management bot for the MrTechTrivia Discord server"
license = "MIT"

[dependencies]
poise = "0.6"
serenity = { version = "0.12", default-features = false, features = [
    "builder",
    "cache",
    "client",
    "gateway",
    "http",
    "model",
    "utils",
    "rustls_backend",
    "collector",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "sync"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "sqlite",
    "chrono",
    "macros",
] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"
rand = "0.8"
regex = "1"
once_cell = "1"
dashmap = "6"
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
humantime = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
imageproc = "0.25"
ab_glyph = "0.2"
sha2 = "0.10"
urlencoding = "2"
futures = "0.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
